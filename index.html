<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Give or Take — How close can you get?</title>
    <meta
      name="description"
      content="Five questions. One slider. Put your instinct somewhere on the line."
    />

    <link rel="icon" href="./give-or-take-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <meta name="theme-color" content="#fdf7ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Give or Take" />
    <meta
      property="og:description"
      content="Five questions. One slider. Put your instinct somewhere on the line."
    />
    <meta property="og:image" content="https://cambo2k20.github.io/give-or-take-quiz/og.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Give or Take — How close can you get?" />
    <meta property="og:url" content="https://cambo2k20.github.io/give-or-take-quiz/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Give or Take" />
    <meta
      name="twitter:description"
      content="Five questions. One slider. Put your instinct somewhere on the line."
    />
    <meta name="twitter:image" content="https://cambo2k20.github.io/give-or-take-quiz/og.png" />

    <!--
      Applied before first paint so saved display choices are present when the
      app mounts. Mode compatibility and palette activation are still validated
      by the typed registry before custom artwork is shown.
    -->
    <script>
      try {
        var saved = localStorage.getItem("give-or-take:theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
        }
        var savedBackground = localStorage.getItem(
          "give-or-take:background:v1",
        );
        if (savedBackground) {
          document.documentElement.dataset.bgTheme = savedBackground;
        }
      } catch (error) {
        // Blocked storage just means we fall back to prefers-color-scheme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
